name: Build Kavir Browser APK

on:
  push:
    branches: ["main"]
    paths-ignore: ["apk/**","README.md"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Build libXray Android AAR
        shell: bash
        run: |
          set -e
          rm -rf /tmp/libXray
          git clone --depth 1 https://github.com/XTLS/libXray.git /tmp/libXray
          cd /tmp/libXray
          go mod download
          python3 build/main.py android
          test -f libXray.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/app/libs/libXray.aar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.1"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/KavirBrowser-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavirBrowser-debug
          path: apk/KavirBrowser-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" apk/KavirBrowser-debug.apk             --title "Kavir Browser Build ${{ github.run_number }}"             --notes "Kavir Browser with locally bundled libXray/Xray core."             --latest=false

      - name: Commit APK to Repository
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KavirBrowser-debug.apk
          git diff-index --quiet HEAD || git commit -m "build: update KavirBrowser-debug.apk [skip ci]"
          git push origin "${{ github.ref_name }}"
