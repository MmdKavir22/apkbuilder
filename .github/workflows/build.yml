name: Build Kavir Browser APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'apk/**'
      - 'README.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/KavirBrowser-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavirBrowser-debug
          path: apk/KavirBrowser-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" apk/KavirBrowser-debug.apk \
            --title "Kavir Browser Build ${{ github.run_number }}" \
            --notes "Automatic APK build from commit ${{ github.sha }}." \
            --latest=false

      - name: Commit APK to Repository
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KavirBrowser-debug.apk
          git status
          git diff-index --quiet HEAD || git commit -m "build: update KavirBrowser-debug.apk [skip ci]"
          git push origin ${{ github.ref_name }}
