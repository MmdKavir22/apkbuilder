name: Build Kavir Telegram Bot Manager APK

on:
  push:
    branches: ["main"]
    paths-ignore: ["apk/**", "README.md"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.1"

      - name: Build Telegram Manager APK
        run: gradle :botmanager:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp botmanager/build/outputs/apk/debug/botmanager-debug.apk apk/KavirTelegramManager-debug.apk
          ls -lh apk/KavirTelegramManager-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavirTelegramManager-APK
          path: apk/KavirTelegramManager-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="telegram-manager-build-${{ github.run_number }}"
          gh release create "$TAG" apk/KavirTelegramManager-debug.apk \
            --title "Kavir Telegram Manager Build ${{ github.run_number }}" \
            --notes "Debug APK for Kavir Telegram Bot Manager." \
            --latest=false

      - name: Commit APK to Repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/KavirTelegramManager-debug.apk
          git diff-index --quiet HEAD || git commit -m "build: update Telegram Manager APK [skip ci]"
          git push origin "${{ github.ref_name }}"
