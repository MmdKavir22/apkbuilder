name: Build APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apk/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in $ANDROID_SDK_ROOT/cmdline-tools"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Put APK in repository
        shell: bash
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/KavirWork-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apk/KavirWork-debug.apk

          if git diff --cached --quiet; then
            echo "APK has not changed."
          else
            git commit -m "Update KavirWork APK"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KavirWork-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
