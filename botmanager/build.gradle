apply plugin: 'com.android.application'

android {
    namespace 'com.kavir.telegrammanager'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kavir.telegrammanager'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
